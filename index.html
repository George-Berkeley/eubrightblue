*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
.anchorjs-link {
    display: none !important;
}
h1:has(a[href*="eubrightblue"]) {
    display: none !important;
}
  
:root{
  --navy:#455763;
  --navy-dark:#455763;
  --blue:#d3dadc;
  --cream:#f5fdff;
  --cream-dark:#e8e2da;
  --gold:#eab51f;
  --ink:#111217;
  --muted:#6b7280;
  --border:#e2ddd4;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Outfit',system-ui,sans-serif;
}

body{
  margin: 0 !important;
  padding: 0 !important;
  width: 100%;
  max-width: 100%;
  overflow-x: clip;
  background: var(--cream);
  font-family:var(--sans);
  color:var(--ink);
  font-size:clamp(15.5px, 0.35vw + 14.5px, 17.5px);
  line-height:1.7;
}

/* NAV */
#nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;gap:1.5rem;
  padding:0 clamp(1.25rem, 4vw, 4rem);height:72px;
  transition:background 0.4s,border-color 0.4s;
}
#nav.solid{background:rgba(0,20,64,0.97);border-bottom:1px solid rgba(255,255,255,0.08)}
#nav.light{background:rgba(250,248,242,0.96);border-bottom:1px solid var(--border)}
    
.nav-brand{text-decoration:none;display:flex;align-items:center;gap:12px;line-height:1;min-width:0}
.nav-logo{
  height:38px;
  width:auto;
  display:block;
  flex-shrink:0;
  background:transparent !important;
}
.nav-brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.nav-brand-name{font-family:var(--serif);font-size:clamp(15px, 1.3vw, 18px);font-weight:400;letter-spacing:0.01em;transition:color 0.3s;white-space:nowrap}
.nav-brand-sub{font-family:var(--sans);font-size:10px;font-weight:300;letter-spacing:0.22em;text-transform:uppercase;transition:color 0.3s;white-space:nowrap}
#nav.solid .nav-brand-name{color:#fff}
#nav.solid .nav-brand-sub{color:rgba(255,255,255,0.4)}
#nav.light .nav-brand-name{color:var(--navy)}
#nav.light .nav-brand-sub{color:var(--gold)}

.nav-links{display:flex;gap:clamp(1.1rem, 2vw, 2.5rem);list-style:none}
.nav-links a{font-size:12px;font-weight:400;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;transition:color 0.2s;white-space:nowrap}
#nav.solid .nav-links a{color:rgba(255,255,255,0.55)}
#nav.solid .nav-links a:hover{color:#fff}
#nav.light .nav-links a{color:var(--muted)}
